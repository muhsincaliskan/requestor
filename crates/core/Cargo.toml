[package]
name = "requestor-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy", "http2", "blocking", "cookies", "gzip", "deflate", "brotli", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }

[lints]
workspace = true
