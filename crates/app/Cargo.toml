[package]
name = "requestor-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
requestor-core = { version = "0.6.0", path = "../core" }
rfd = "0.18.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
requestor-core = { version = "0.6.0", path = "../core", features = ["test-support"] }
serde_json = "1.0.154"

[lints]
workspace = true
