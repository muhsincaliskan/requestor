[package]
name = "requestor-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
requestor-core = { version = "0.1.0", path = "../core" }
rfd = "0.18.0"

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
requestor-core = { version = "0.1.0", path = "../core", features = ["test-support"] }
serde_json = "1.0.154"

[lints]
workspace = true
