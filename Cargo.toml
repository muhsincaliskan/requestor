[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.95"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
