name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable && rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  memory:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable
      - name: Build release
        run: cargo build --release --locked -p requestor-app
      - name: Idle with five tabs
        run: scripts/measure-ram.sh 5 0 120
      - name: Eight tabs with a 5 MB response
        run: scripts/measure-ram.sh 8 5 180
