name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build universal bundle
        run: scripts/bundle-macos.sh aarch64-apple-darwin x86_64-apple-darwin
      - name: Zip the app and the CLI
        run: |
          ditto -c -k --keepParent target/bundle/Requestor.app target/bundle/Requestor-macos.zip
          tar -czf target/bundle/requestor-cli-macos-universal.tar.gz -C target/bundle requestor
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            target/bundle/*.dmg
            target/bundle/Requestor-macos.zip
            target/bundle/requestor-cli-macos-universal.tar.gz
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" target/bundle/*.dmg target/bundle/Requestor-macos.zip target/bundle/requestor-cli-macos-universal.tar.gz --clobber
          scripts/release-checksums.sh "$RELEASE_TAG"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --locked -p requestor-app -p requestor-cli
      - name: Package
        run: tar -czf requestor-linux-x86_64.tar.gz -C target/release requestor requestor-app
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: requestor-linux-x86_64.tar.gz
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" requestor-linux-x86_64.tar.gz --clobber

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      SIGN_WINDOWS: ${{ secrets.SIGNPATH_API_TOKEN != '' && startsWith(github.ref, 'refs/tags/') }}
      SIGNPATH_APPROVAL_TIMEOUT_SECONDS: 3600
      SIGNED_DIR: target/signed
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --locked -p requestor-app -p requestor-cli
      - name: Read product version
        id: version
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Upload unsigned app for signing
        id: unsigned
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: target/release/requestor-app.exe
      - name: Sign with SignPath
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ env.SIGNPATH_APPROVAL_TIMEOUT_SECONDS }}
          output-artifact-directory: ${{ env.SIGNED_DIR }}
          parameters: |
            version: ${{ toJSON(steps.version.outputs.value) }}
      - name: Use signed app
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: Copy-Item -Force "$env:SIGNED_DIR/requestor-app.exe" target/release/requestor-app.exe
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/requestor.exe, target/release/requestor-app.exe -DestinationPath requestor-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: requestor-windows-x86_64.zip
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" requestor-windows-x86_64.zip --clobber

  checksums:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish SHA256SUMS
        run: scripts/release-checksums.sh "$RELEASE_TAG"
